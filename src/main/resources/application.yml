# UniversalShield base configuration. Profile files override these values:
#   dev  (default) - file-based H2 database, demo account, for local use on Windows without PostgreSQL
#   test           - in-memory H2, used by the automated tests
#   prod           - PostgreSQL, secure cookies; every secret comes from environment variables
spring:
  application:
    name: universalshield
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/universalshield}
    username: ${DB_USERNAME:universalshield}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, Hibernate only validates it
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 64KB
      max-request-size: 128KB
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
        name: JSESSIONID
  tomcat:
    max-swallow-size: 256KB

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

universalshield:
  api-docs:
    public: ${API_DOCS_PUBLIC:true}
  risk:
    thresholds:
      medium: ${RISK_THRESHOLD_MEDIUM:30}
      high: ${RISK_THRESHOLD_HIGH:60}
      critical: ${RISK_THRESHOLD_CRITICAL:85}
  transaction:
    large-amount: ${TRANSACTION_LARGE_AMOUNT:10000}
  security:
    hash-secret: ${APP_HASH_SECRET:change-me-dev-only-secret}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
      scans-per-minute: ${RATE_LIMIT_SCANS_PER_MINUTE:30}
  retention:
    default-days: ${RETENTION_DEFAULT_DAYS:90}
    max-days: 365
    cron: "0 30 3 * * *"
  ml:
    enabled: ${ML_ENABLED:true}
    model-dir: ${ML_MODEL_DIR:models}
  demo:
    seed: false
    email: demo@universalshield.local
    password: ""
